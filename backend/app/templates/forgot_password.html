<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta
        name="viewport"
        content="width=device-width, initial-scale=1"
    >
    <title>Reset Password - Atta Video AI · Atta Video AI</title>
    <link
        rel="stylesheet"
        rel="icon" type="image/svg+xml" href="/static/images/logo.svg">
    <link rel="stylesheet" href="/static/style.css"
    >
</head>
<body>
    <main class="login-card">
        <h1>Reset Password</h1>

        <p>
            Use the recovery code you generated
            from My Profile.
        </p>

        {% if error %}
        <div class="error">
            {{ error }}
        </div>
        {% endif %}

        {% if success %}
        <div class="success">
            {{ success }}
        </div>

        <p style="margin-top:20px;">
            <a href="/login">
                Return to Sign In
            </a>
        </p>

        {% else %}

        <form
            method="post"
            action="/forgot-password"
        >
            <label>
                Username or Email
            </label>

            <input
                type="text"
                name="identifier"
                required
                autocomplete="username"
            >

            <label>
                Recovery Code
            </label>

            <input
                type="text"
                name="recovery_code"
                required
                placeholder="XXXX-XXXX-XXXX-XXXX"
                autocomplete="off"
            >

            <label>
                New Password
            </label>

            <input
                type="password"
                name="new_password"
                minlength="8"
                required
                autocomplete="new-password"
            >

            <label>
                Confirm New Password
            </label>

            <input
                type="password"
                name="confirm_password"
                minlength="8"
                required
                autocomplete="new-password"
            >

            <button type="submit">
                Reset Password
            </button>
        </form>

        <p style="margin-top:20px;">
            <a href="/login">
                Back to Sign In
            </a>
        </p>

        {% endif %}
    </main>
</body>
</html>
